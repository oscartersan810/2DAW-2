<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 1</title>
</head>
<body>
    <h1>Ejercicio 1</h1>
    <input type="button" value="Generar Lista" id="b1" onclick="generaLista()">
    <ol id="lista1">
    </ol>l
    <script>
        function generaLista() {
            const dias = ['lunes','martes','miercoles','jueves','viernes','sabado','domingo'];
            let cadena = "";
            for(let dia of dias){
                cadena+= `<li>${dia}</li>`;
                document.getElementById('lista1').innerHTML = cadena;
            }
        }
    </script>
</body>
</html>
