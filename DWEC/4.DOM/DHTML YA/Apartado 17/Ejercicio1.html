<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 1</title>
</head>
<body>
    <h1>Ejercicio 1</h1>
    <table id="tabla1">
        <tr>
            <td>11</td>
            <td>12</td>
        </tr>
        <tr>
            <td>21</td>
            <td>22</td>
        </tr>
    </table>
    <input type="button" value="Inicializar borde" onclick="definirAtributo()">
    <input type="button" value="Borrar borde" onclick="borrarAtributo()">
    <script>
        function definirAtributo(){
            let tabla = document.getElementById('tabla1');
            tabla.setAttribute('border','5');
        }
        function borrarAtributo() {
            let tabla = document.getElementById('tabla1');
            tabla.removeAttribute('border','5');
        }
    </script>
</body>
</html>
