<!DOCTYPE html>

<body>
    <h1>Comprueba Numero Entero</h1>
    <p>Pulsa f12 para ver la consola de depuración</p>
    <script>
        function validaNumeroEntero(numero) {
            let patron = /^[+-]?[0-9]+$/;

            if (patron.test(numero)) {
                return numero+ " es número entero";

            }else{
                return numero+ " no es número entero";
            }
        }

        console.log(validaNumeroEntero("123"));
        console.log(validaNumeroEntero("-25"));
        console.log(validaNumeroEntero("+4882"));
        console.log(validaNumeroEntero("a45f"));

    </script>
</body>
</html>
