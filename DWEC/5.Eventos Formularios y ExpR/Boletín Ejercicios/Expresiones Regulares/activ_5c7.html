<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Actividad 5c6</title>
</head>
<body>
    <h1>Extraer posiciones de emails</h1>
    <p>Pulsa f12 para ver la consola de depuración</p>
    <script>
        function extraerPosicionesEmails(texto) {
            let patron = /\w+@([a-zA-Z_]+\.)+[a-zA-Z]{2,6}/;
            let posiciones = [];

            if (patron.test(texto)) {
                posiciones.push(texto);

            }
            return posiciones;
        }

        console.log(extraerPosicionesEmails("miemail@gmail.com"));
        console.log(extraerPosicionesEmails("oscar@gmail.com"));
        console.log(extraerPosicionesEmails("juanjosel@hotmail.com"));

    </script>
</body>
</html>
