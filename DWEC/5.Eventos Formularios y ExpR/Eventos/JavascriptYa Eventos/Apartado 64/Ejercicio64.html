<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ejercicio 64</title>
  </head>
  <body>
    <div
      style="width: 200px; height: 200px; background: red"
      id="recuadro1"
    ></div>

    <script>
      document
        .getElementById("recuadro1")
        .addEventListener("mousedown", presion1);
      document
        .getElementById("recuadro1")
        .addEventListener("mouseup", presion2);

      function presion1() {
        document.getElementById("recuadro1").style.backgroundColor = "#ffff00";
      }

      function presion2() {
        document.getElementById("recuadro1").style.backgroundColor = "#ff0000";
      }
    </script>
  </body>
</html>
