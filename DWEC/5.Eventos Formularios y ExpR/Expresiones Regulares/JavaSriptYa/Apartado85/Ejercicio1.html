<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Ejercicio 1 A85</h1>

    <form id="formulario">
        <label for="numero">Número: </label>
        <input type="number" id="numero" name="numero" placeholder="ej: 19:45:00" required><br><br>
        <input type="button" value="Comprobar" onclick="iniciar()">
    </form>
    <p id="nota"></p>

    <script>
        function iniciar() {

            let numero = document.querySelector("#numero").value;
            let parrafo = document.querySelector("#nota");

            let comprobarPatron =/^(([0-1]\d|2[0-3]):([0-5]\d):([0-5]\d))$/;

            if (comprobarPatron.test(numero)) {
                parrafo.innerHTML = "PATRÓN CORRECTO!";
            } else {
                parrafo.innerHTML = "PATRON INCORRECTO!";
            }
        }

        // Añadimos el evento al formulario para que funcione correctamente
        document.querySelector("#formulario").addEventListener("load", iniciar);
    </script>
</body>
</html>
