<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>JavaScript</title>
	<style>
	  body {
		margin: 20px; /* Espacio externo */

		font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            font-size: 1rem;
            font-weight: 400;
            line-height: 1.5;
            color: #212529;
            background-color: #f8f9fa;
	  }

	  .btn {
            display: inline-block;
            font-weight: 400;
            color: #fff;
            text-align: center;
            vertical-align: middle;
            user-select: none;
            background-color: #007bff;
            border: 1px solid #007bff;
            padding: 0.375rem 0.75rem;
            font-size: 1rem;
            line-height: 1.5;
            border-radius: 0.25rem;
            transition: color 0.15s ease-in-out, background-color 0.15s ease-in-out, border-color 0.15s ease-in-out, box-shadow 0.15s ease-in-out;
            text-decoration: none;
        }

        .btn:hover {
            color: #fff;
            background-color: #0056b3;
            border-color: #004085;
            text-decoration: none;
        }


      #contenido {
            border: 1px solid lightgray; /* Borde gris claro */
            background-color: lightyellow; /* Fondo amarillo claro */
            border-radius: 10px; /* Bordes redondeados */
            min-height: 50px; /* Altura mínima de 50 píxeles */
            padding: 10px; /* Espacio interno */
           
        }
	</style>
</head>

<body>
	<h1>Arrays dispersos</h1>
	<h2>Pulsa F12 para ver la consola de depuración</h2>

	<!-- Con el atributo onclick indicamos qué función de JS queremos que se ejecute al pulsar el botón-->
	<input type="button" class="btn" onclick="ejecutar()" value="Pulsar">
	<br><br>
	<div id="contenido" ></div>

	<script>
		// Dentro de la etiqueta script va el código en JavaScript
		function ejecutar() {
      let promedio1;
      let promedio2;
			// Array no disperso
      let notas1= [8.2, 6.1, 4.8, 9.5];
      // Array disperso
      let notas2= [8.2, ,6.1,,, 4.8,, 9.5];
      // Usamos la función calculaPromedio1
      promedio1= calculaPromedio1(notas1);
      promedio2= calculaPromedio1(notas2);

      console.log("-------- Promedio usando función calculaPromedio1() -----------");
      console.log(`Array [${notas1.toString()}] => ${promedio1}`);
      console.log(`Array [${notas2.toString()}] => ${promedio2}`);

      // Usamos la función calculaPromedio1
      promedio1= calculaPromedio2(notas1);
      promedio2= calculaPromedio2(notas2);

      console.log("-------- Promedio usando función calculaPromedio2() -----------");
      console.log(`Array [${notas1.toString()}] => ${promedio1}`);
      console.log(`Array [${notas2.toString()}] => ${promedio2}`);

		}

    
    // Función para calcular el promedio
    // No sirve para arrays dispersos
    function calculaPromedio1(numeros){
      let sum = 0; // Variable acumuladora
      for(let i=0; i < numeros.length; i++){
        sum += numeros[i];
      }
      return sum/numeros.length;
    }

    // Función para calcular el promedio
    // Puede trabajar con arrays dispersos
    function calculaPromedio2(numeros){
      let sum = 0; // Variable acumuladora
      let contador =0; // Variables para el recuento de eltos no undefined en el array
      for(let i=0; i < numeros.length; i++){
        if(numeros[i] != undefined){
          sum += numeros[i];
          contador++;
        }
      }
      return sum/contador;
    }



		// Función para volvar contenido a la página web
		function volcarTextoWeb(texto){
			document.querySelector("#contenido").insertAdjacentHTML('beforeend',`<p>${texto}</p>`);
		}
	</script>

</body>

</html>
