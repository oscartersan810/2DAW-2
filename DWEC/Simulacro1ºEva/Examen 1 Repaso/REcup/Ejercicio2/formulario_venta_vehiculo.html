<body>
    <div class="container border">
        <div class="row">
            <header id="hearder" class="col-12 bg-primary text-white p-4">
                <h1>Venta de vehículos RuizCar</h1>
            </header>

            <nav id="menu" class="col-12 bg-secondary text-white">
                <ul class="row w-50">
                    <li class="col">Inicio</li>
                    <li class="col">Página 1</li>
                    <li class="col">Página 2</li>
                    <li class="col">Página 3</li>
                    <li class="col">Contacto</li>
                </ul>
            </nav>

            <div id="content" class="col-12 mb-4">
                <div class="row">
                    <section class="container border col-9 mt-4 mb-4">
                        <h1>Datos de la venta</h1>
                        <hr>
                        <form name="miformulario" method="POST" action="procesar.php">
                            <div class="row mb-4">
                                <div class="col-md-4">
                                    <label for="inputNombre" class="form-label">Nombre(*)</label>
                                    <input type="text" class="form-control" id="inputNombre" required>
                                </div>
                                <div class="col-md-4">
                                    <label for="inputApellidos" class="form-label">Apellidos(*)</label>
                                    <input type="text" class="form-control" id="inputApellidos" required>
                                </div>
                                <div class="col-md-4">
                                    <label for="inputEmail" class="form-label">Email(*)</label>
                                    <input type="text" class="form-control" id="inputEmail" required>
                                </div>
                            </div>
                            <div class="row mb-4">
                                <div class="col-md-4">
                                    <label for="inputFijo" class="form-label">Tel.fijo</label>
                                    <input type="text" class="form-control" id="inputFijo">
                                </div>
                                <div class="col-md-4">
                                    <label for="inputMovil" class="form-label">Tel.Móvil</label>
                                    <input type="text" class="form-control" id="inputMovil">
                                </div>
                            </div>
                            <hr>
                            <div class="row mb-4">
                                <div class="col-md-6">
                                    <label class="form-label" for="inputVehiculo">Vehículo(*):</label>
                                    <select class="form-control form-select" id="inputVehiculo" required>
                                        <option value="">Seleccionar</option>
                                        <option value="1">Seat Ibiza</option>
                                        <option value="2">Toyota Yaris</option>
                                        <option value="3">BMW 320</option>
                                        <option value="4">Audi Q3</option>
                                    </select>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label" for="inputFechaEntrega">Fecha Entrega(*):</label>
                                    <input class="form-control" type="date" id="inputFechaEntrega" required>
                                </div>
                            </div>
                            <div class="row mb-4">
                                <div class="col-md-6">
                                    <div class="form-check">
                                        <input type="checkbox" class="form-check-input"  value="" id="inputFinancia">
                                        <label class="form-check-label" for="flexCheckDefault">
                                          Marque esta casilla si financia
                                        </label>
                                      </div>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label">Años Financiación:</label>
                                    <div class="form-check">
                                        <input type="radio" class="form-check-input"  name="inputAñosFinanciacion" id="inputFinanciacion-2" disabled>
                                        <label class="form-check-label" for="flexRadioDisabled">
                                          Dos años
                                        </label>
                                      </div>
                                      <div class="form-check">
                                        <input type="radio" class="form-check-input"  name="inputAñosFinanciacion" id="inputFinanciacion-3"  disabled>
                                        <label class="form-check-label" for="flexRadioCheckedDisabled">
                                          Tres años
                                        </label>
                                      </div>
                                      <div class="form-check">
                                        <input type="radio" class="form-check-input"  name="inputAñosFinanciacion" id="inputFinanciacion-4"  disabled>
                                        <label class="form-check-label" for="flexRadioCheckedDisabled">
                                          Cuatro años
                                        </label>
                                      </div>
                                </div>
                            </div>
                            <hr>
                            <input type="submit" class="btn btn-primary" id="enviar" value="Enviar">
                            <input type="reset" class="btn btn-warning" value="Borrar">
                        </form>
                    </section>

                    <aside class="col-3 border mt-4 mb-4">
                        <h2>Ofertas</h2>
                        <div class="lateral row bg-light align-items-center">
                            <div class="col bg-primary col-4 align-self-start">Oferta 1</div>
                            <div class="col bg-success col-4 align-self-center">OFerta 2</div>
                            <div class="col bg-warning col-4 align-self-end">Oferta 3</div>
                        </div>
                </aside>
                </div>
            </div>
        </div>



        <footer class="col-lg-12 bg-info">
            RuizCar Diciembre 2022&copy;
        </footer>

    </div>
    </div>
