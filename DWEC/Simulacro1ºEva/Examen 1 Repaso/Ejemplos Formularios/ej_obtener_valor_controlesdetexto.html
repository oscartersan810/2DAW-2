<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form action="">
        <label for="inputtext1">Nombre:</label><br>
        <input type="text" name="inputtext1" id="inputtext1">
        <br><br>
        <label for="textarea1">Observaciones:</label><br>
        <textarea name="textarea1" id="textarea1" cols="30" rows="10"></textarea>
    </form>
    <br>
    <input type="button" id="boton1" value="Rescatar valores">
    <script>
        function iniciar(){
         document.getElementById("boton1").addEventListener('click',rescatarContenido);
        }

        function rescatarContenido(){
            let contenido_cuadrotexto = document.getElementById("inputtext1").value;
            let contenido_textarea = document.getElementById("textarea1").value;
            alert(`El cuadro de texto tiene el siguiente contenido:\n  "${contenido_cuadrotexto}"`);
            alert(`El textarea tiene el siguiente contenido:\n  "${contenido_textarea}"`);
        }

        addEventListener('load',iniciar);
    </script>
</body>
</html>
