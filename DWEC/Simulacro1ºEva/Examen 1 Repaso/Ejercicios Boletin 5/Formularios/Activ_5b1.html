<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Actividad 5b1</title>
</head>
<body>
    <h1>Alta Paciente</h1>
    <form id="altaPacienteForm" action="procesa.php" method="post">
        <label for="nombre">Nombre(*): </label>
        <input type="text" id="nombre" name="nombre" maxlength="30" required><br>
    
        <label>Sexo(*):</label>
        <input type="radio" id="hombre" name="sexo" value="Hombre" required>
        <label for="hombre">Hombre</label>
        <input type="radio" id="mujer" name="sexo" value="Mujer" required>
        <label for="mujer">Mujer</label><br>
    
        <label for="altura">Altura(50-210cm)(*): </label>
        <input type="number" id="altura" name="altura" min="50" max="210" required><br><br><br>
    
        <label for="fechaNacimiento">Fecha de Nacimiento(*):</label>
        <input type="date" id="fechaNacimiento" name="fechaNacimiento" required><br><br><br>
    
        <label for="semanaPreferente">Semana Preferente para la cita:</label>
        <input type="week" id="semanaPreferente" name="semanaPreferente"><br><br><br>
    
        <label for="fumador">Fumador:</label>
        <input type="checkbox" id="fumador" name="fumador">
        <select id="numCigarrillos" name="numCigarrillos" disabled>
            <option value="" disabled selected>Seleccionar</option>
            <option value="1-5">1-5</option>
            <option value="6-10">6-10</option>
            <option value="masDe10">Más de 10</option>
        </select><br>
    
        <label for="observaciones">Observaciones:</label><br>
        <textarea id="observaciones" name="observaciones"></textarea><br>
    
        <button type="submit">Enviar</button>
        <button type="reset">Borrar</button>
    </form>
    
    <script>
        document.getElementById('fumador').addEventListener('change', function () {
            var numCigarrillos = document.getElementById('numCigarrillos');
            numCigarrillos.disabled = !this.checked;
            if (!this.checked) {
                numCigarrillos.value = "";
            }
        });
    </script>
</body>
</html>
