<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Calculo Fecha</title>
  </head>
  <body>
    <h1>Ejercicio 3: Calcular dias entre Fechas</h1>
    <input type="button" value="Calcular Fechas" onclick="pruebaFecha()"><br>
    <script>
      function numeroDiasFechas(fechaDesde, fechaHasta) {
        // Convierte las fechas en objetos Date
        let fechaDesdeObj = new Date(fechaDesde);
        let fechaHastaObj = new Date(fechaHasta);

        // Calcula la diferencia en milisegundos
        let diferenciaMilisegundos = fechaHastaObj - fechaDesdeObj;

        // Convierte la diferencia en días
        let diferenciaDias = diferenciaMilisegundos / (1000 * 60 * 60 * 24);

        // Redondea la diferencia a un número entero
        return Math.round(diferenciaDias);
      }

      function pruebaFecha() {
        // Ejemplo de uso
        let diasTranscurridos = numeroDiasFechas("05/05/1975", "10/05/1975");
        document.write(diasTranscurridos); // Debería devolver 5
      }
    </script>
  </body>
</html>
