<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <h1>Ejercicio 2: Mayores Once</h1>
    <input type="button" value="Calcular Mayores Once" onclick="pruebaMayoresOnce()"><br>
    <script>
      function esPrimo(numero) {
        if (numero <= 1) {
          return false;
        }
        if (numero <= 3) {
          return true;
        }
        if (numero % 2 === 0 || numero % 3 === 0) {
          return false;
        }
        let i = 5;
        while (i * i <= numero) {
          if (numero % i === 0 || numero % (i + 2) === 0) {
            return false;
          }
          i += 6;
        }
        return true;
      }

      function filtrarPrimosMayoresOnce(array) {
        let primosMayoresOnce = array.filter(
          (numero) => numero > 11 && esPrimo(numero)
        );

        // Ordena el array de menor a mayor
        primosMayoresOnce.sort((a, b) => a - b);

        return primosMayoresOnce;
      }
      function pruebaMayoresOnce() {
        // Ejemplo de uso
      let resultado = filtrarPrimosMayoresOnce([
        6, 11, 18, 43, 8, 5, 45, 53, 9, 7, 24, 23,
      ]);
      document.write(resultado); // Debería devolver [23, 43, 53]
      }
      
    </script>
  </body>
</html>
