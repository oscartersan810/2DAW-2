<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio Boletin Ajax</title>
</head>
<body>
    <h1>Comunidades autónomas Ajax</h1>

    <form action="" method="get">
        <label for="comunidad">Seleccione la comunidad Autónoma:</label>
        <select name="comunidad_autonoma" id="comunidad_autonoma">
            <option value="" selected>Seleccionar...</option>
            <option value="Andalucia">Andalucía</option>
            <option value="Extremadura">Extremadura</option>
            <option value="Castilla-la Mancha">Castilla-La Mancha</option>
            <option value="Comunidad Valenciana">Comunidad Valenciana</option>
            <option value="Castilla y León">Castilla Y León</option>
            <option value="Aragón">Aragón</option>
        </select><br><br>
        <label for="comunidad">Provincia:</label>
        <select name="provincia" id="provincia">
            <option value="" selected>Seleccionar...</option>
        </select>
    </form>
</body>
</html>
