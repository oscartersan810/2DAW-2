<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JavaScript</title>
    <style>
      body {
        margin: 20px; /* Espacio externo */

        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          "Helvetica Neue", Arial, sans-serif;
        font-size: 1rem;
        font-weight: 400;
        line-height: 1.5;
        color: #212529;
        background-color: #f8f9fa;
      }

      .btn {
        display: inline-block;
        font-weight: 400;
        color: #fff;
        text-align: center;
        vertical-align: middle;
        user-select: none;
        background-color: #007bff;
        border: 1px solid #007bff;
        padding: 0.375rem 0.75rem;
        font-size: 1rem;
        line-height: 1.5;
        border-radius: 0.25rem;
        transition: color 0.15s ease-in-out, background-color 0.15s ease-in-out,
          border-color 0.15s ease-in-out, box-shadow 0.15s ease-in-out;
        text-decoration: none;
      }

      .btn:hover {
        color: #fff;
        background-color: #0056b3;
        border-color: #004085;
        text-decoration: none;
      }

      #contenido {
        border: 1px solid lightgray; /* Borde gris claro */
        background-color: lightyellow; /* Fondo amarillo claro */
        border-radius: 10px; /* Bordes redondeados */
        min-height: 50px; /* Altura mínima de 50 píxeles */
        padding: 10px; /* Espacio interno */
      }
    </style>
  </head>

  <body>
    <h1>Tabla Multiplicar</h1>
    <h2>Pulsa F12 para ver la consola de depuración</h2>

    <label for="numeroEntrada">Numero Entrada: </label>
    <input placeholder="Numero de Entrada" id="numeroEntrada" /><br /><br />
    <label for="numeroMaximo">Máximo: </label>
    <input placeholder="Numero Máximo" id="maximo" /><br /><br />
    <input
      type="button"
      class="btn"
      onclick="muestraTabla()"
      value="Mostrar Tabla"
    />
    <br /><br />

    <div id="contenido" ></div>

    <script>

      function leerNumero(nEntrada) {
        return nEntrada = document.getElementById("numeroEntrada");
      }

      function maxNumTabla(maximoNumero) {
       return maximoNumero = document.getElementById("maximo");
      }

      function muestraTabla(nEntrada, maxNumero) {
        let numero = leerNumero(nEntrada);
        let maximo = maxNumTabla(maxNumero);

        for (let i = 0; i < maxNumero; i++) {
          volcarTextoWeb(nEntrada + "*" + (i + 1) + "=" + nEntrada * (i + 1));
          volcarTextoWeb("<br>");
        }
      }

      function volcarTextoWeb(texto){
      	document.querySelector("#contenido").insertAdjacentHTML('beforeend',`<p>${texto}</p>`);
      }

      // let numero = parseInt(prompt("Introduzca el número a multiplicar"));
      // let maximo = parseInt(prompt("Introduzca el máximo"));

      // muestraTabla(numero, maximo);

    </script>
  </body>
</html>
