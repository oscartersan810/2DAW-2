<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 1 A11</title>
</head>
<body>
    <h1>Ejercicio 1</h1>
    <script>
        let palabra = prompt("Introduzca estas palabras para ver en inglés (casa, mesa, perro, gato)");

        switch (palabra) {
            case "casa":
                document.write("House");
                break;
            case "mesa":
                document.write("Table");
                break;
            case "perro":
                document.write("Dog");
                break;
            case "gato":
                document.write("Cat");
                break;
            default:
                document.write("La palabra introducida no está en la lista");
                break;
        }
    </script>
</body>
</html>
