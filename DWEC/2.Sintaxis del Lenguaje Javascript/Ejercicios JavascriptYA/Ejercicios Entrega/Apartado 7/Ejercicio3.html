<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 3 A7 MJ</title>
</head>
<body>
    <h1>Ejercicio 3</h1>
    <p>Pulsa f12 para ver el resultado en la consola</p>
    <script>
        let numero = parseInt(prompt("Introduzca un numero (1 - 999)"));
        let digitos = 0;

        if (numero<10) {
            digitos=1;
            console.log("El numero "+numero+ " tiene "+digitos+" digitos/s");
        } else if (numero>=10 && numero<100) {
            digitos=2;
            console.log("El numero "+numero+ " tiene "+digitos+" digitos/s");
        } else if (numero>=100 && numero<1000) {
            digitos=3;
            console.log("El numero "+numero+ " tiene "+digitos+" digitos/s");
        } else{
            console.log("El numero tiene mas de 3 digitos");
        }
    </script>
</body>
</html>
