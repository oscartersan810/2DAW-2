<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 1 A7 MJ</title>
</head>
<body>
    <h1>Ejercicio 1</h1>
    <script>
        let valor1 = parseFloat(prompt("Valor 1 Decimal"));
        let valor2 = parseFloat(prompt("Valor 2 Decimal"));

        if (valor1>valor2) {
            console.log("Suma: "+(valor1+valor2));
            console.log("<br>");
            console.log("Diferencia: "+(valor1-valor2));
        } else{
            console.log("Producto: "+(valor2*valor1));
            console.log("<br>");
            console.log("Division: "+(valor2/valor1));
        }
    </script>
</body>
</html>
