<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 4 A9 MJ</title>
</head>
<body>
    <h1>Ejercicio 4</h1>
    <p>Pulsa f12 para ver el resultado en la consola</p>

    <script>
        let x = parseFloat(prompt("Valor X"));
        let y = parseFloat(prompt("Valor Y"));

        if (x>0 && y>0) {
            console.log("Valor X: "+x);
            console.log("<br>");
            console.log("Valor Y: "+y);
            console.log("<br>");
            console.log("Primer cuadrante");
        } else if (x<0 && y>0) {
            console.log("Valor X: "+x);
            console.log("<br>");
            console.log("Valor Y: "+y);
            console.log("<br>");
            console.log("Segundo cuadrante");
        } else {
            console.log("Valor X: "+x);
            console.log("<br>");
            console.log("Valor Y: "+y);
            console.log("<br>");
            console.log("Tercer cuadrante");
        }
    </script>
</body>
</body>
</html>
